<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Breakfast Buddy</title>

    <!-- Normalize.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-oHDEc8Xedv1NwQzGZtFgCjN3YcUy9T0nZZdUQZxNH1wQlP5x+uaU2H8bXbqWJGxK5tC1bOgxCCWZtwkqF7vK0A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-8eXWicQgnJ0yOVfa9WyaOOZhvAUKOx2fYqSb3rQ0l4y5j8vR5d/TefR0HeF+X/1k" crossorigin="anonymous">

    <!-- jQuery UI CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css">


    <style>
        /* ==============================
       Enhanced Input Box
       ============================== */
        #foodInput {
            width: 75%;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 2px solid #d3b0d9;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            background: linear-gradient(145deg, #f7e6f9, #e7c7f2);
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.05);
            transition: all 0.25s ease-in-out;
        }

        #foodInput:focus {
            border-color: #b45898;
            box-shadow: 0 0 8px rgba(180, 88, 152, 0.4);
            outline: none;
            background: #ffffff;
            /* brightens on focus */
        }

        #foodInput::placeholder {
            color: #a88ca1;
            opacity: 1;
        }

        /* ==============================
       Body & Headings
       ============================== */
        body {
            background-color: #e2c4f3;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            color: #b45898;
            text-align: center;
            background-color: #ffffff;
            margin: 0;
            padding: 10px 0;
        }

        h2,
        h3 {
            color: #b14490;
        }
        

        /* ==============================
       Sections
       ============================== */

        #madeBy {
            text-align: center; 
        }

        #inputSection,
        #selectSection,
        #logSection {
            margin: 20px;
            padding: 20px;
            background-color: #f9e1f7;
            border-radius: 10px;
        }

        #inputSection {
            width: 400px;
        }

        /* ==============================
       Buttons
       ============================== */
        #createBtn,
        #logBtn {
            background-color: #b45898;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        #foodButtons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            cursor: pointer;
        }

        #foodButtons button:not(.deleteBtn):not(.selected) {
            background-color: #b993a9;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }

        .selected {
            background-color: rgb(155, 228, 155);
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }

        .deleteBtn,
        .deleteBtn2 {
            background-color: red;
            color: white;
            border: none;
            margin-left: 3px;
            cursor: pointer;
        }

        .editBtn {
            background-color: #b45898;
            color: white;
            border: none;
            margin-left: 3px;
            cursor: pointer;
        }

        /* ==============================
       Breakfast Log List
       ============================== */
        #breakList li {
            color: #b14490;
            font-size: 18px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <h1>Welcome to Breakfast Buddy where you can track your breakfast every morning!</h1>
    <h3 id="madeBy">Made by Carly Copley for Projects in Information Systems</h3>

    <div id="inputSection">
        <h2>Create A New Breakfast Item Here</h2>

        <input id="foodInput" type="text" placeholder="Add breakfast item">
        <button id="createBtn" onclick="createFoodButton()">Create Button</button>
    </div>

    <div id="selectSection">
        <h2>Select Today's Breakfast By Clicking On Your Existing Breakfast Items</h2>

        <div id="foodButtons"></div>

        <br>
        <button id="logBtn" onclick="submitBreakfast()">Log Breakfast</button>
    </div>

    <div id="logSection">
        <h2>Breakfast Log</h2>
        <h3>Sorted From Newest to Oldest</h3>
        <ul id="breakList"></ul>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-3gJwYp+6X/16zS0fry2tS3rfiEGTLU8I1nG8Iknn1PY=" crossorigin="anonymous"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"
        integrity="sha256-tR0zYp+U7bX3+H9wZ1rB7B+cuKUdV5xL47jv9k2kuZk=" crossorigin="anonymous"></script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HY3QG5uHLi1kTdHupkf0vCz8GvkeEk9c1i2y9C1pI/Uy5kP35yQvK6U1kEf32G6x"
        crossorigin="anonymous"></script>

    <!-- Keep all your original JS below -->
    <script>
        // your working JS here, exactly as it was
        document.getElementById("foodInput").addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                createFoodButton();
            }
        });

        function createFoodButton() {
            let food = document.getElementById("foodInput").value.trim();
            if (!food) return;
            food = food.charAt(0).toUpperCase() + food.slice(1).toLowerCase();

            const container = document.createElement("div");
            const button = document.createElement("button");
            button.textContent = food;
            button.onclick = function () { button.classList.toggle("selected"); };

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "✕";
            deleteBtn.classList.add("deleteBtn");
            deleteBtn.onclick = function () { container.remove(); };

            container.appendChild(button);
            container.appendChild(deleteBtn);
            document.getElementById("foodButtons").appendChild(container);
            document.getElementById("foodInput").value = "";

            sortButtons();

            fetch('/api/breakfast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: food })
            }).then(res => res.json()).then(console.log).catch(console.error);
        }

        function sortButtons() {
            const container = document.getElementById("foodButtons");
            const items = Array.from(container.children);
            items.sort((a, b) => a.querySelector("button").textContent.localeCompare(b.querySelector("button").textContent));
            container.innerHTML = "";
            items.forEach(item => container.appendChild(item));
        }

        async function loadBreakfastItems() {
            try {
                const res = await fetch('/api/breakfast');
                const items = await res.json();
                const container = document.getElementById('foodButtons');
                container.innerHTML = '';
                items.forEach(item => {
                    const div = document.createElement('div');
                    const btn = document.createElement('button');
                    btn.textContent = item.name;
                    btn.onclick = () => btn.classList.toggle('selected');

                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = '✕';
                    deleteBtn.classList.add('deleteBtn');
                    deleteBtn.onclick = async () => {
                        await fetch(`/api/breakfast/${item._id}`, { method: 'DELETE' });
                        loadBreakfastItems();
                    };

                    div.appendChild(btn);
                    div.appendChild(deleteBtn);
                    container.appendChild(div);
                });
                sortButtons();
            } catch (err) {
                console.error(err);
            }
        }

        function submitBreakfast() {
            const selected = document.querySelectorAll("#foodButtons button.selected");
            if (!selected.length) return;

            const foods = Array.from(selected).map(btn => btn.textContent);
            const date = new Date().toISOString();

            fetch('/api/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ foods, date })
            }).then(res => res.json()).then(() => {
                selected.forEach(btn => btn.classList.remove("selected"));
                loadMealLogs();
            }).catch(console.error);
        }

        async function loadMealLogs() {
            try {
                const res = await fetch('/api/logs');
                const logs = await res.json();
                const ul = document.getElementById('breakList');
                ul.innerHTML = '';

                logs.sort((a, b) => new Date(b.date) - new Date(a.date));

                logs.forEach(log => {
                    const li = document.createElement('li');
                    const textSpan = document.createElement('span');
                    textSpan.textContent = `(${new Date(log.date).toLocaleString()}) ${log.foods.join(', ')}`;

                    const editBtn = document.createElement('button');
                    editBtn.classList.add("editBtn");
                    editBtn.textContent = "Edit";
                    editBtn.onclick = async () => {
                        const newFoods = prompt('Edit this breakfast log:', log.foods.join(', '));
                        if (!newFoods) return;
                        const updatedFoods = newFoods.split(',').map(f => f.trim());

                        const newDate = prompt('Edit the date/time of this log:', log.date);
                        if (!newDate) return;

                        await fetch(`/api/logs/${log._id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ foods: updatedFoods, date: newDate })
                        });
                    };

                    const deleteBtn = document.createElement('button');
                    deleteBtn.classList.add("deleteBtn2");
                    deleteBtn.textContent = "Delete";
                    deleteBtn.onclick = async () => {
                        await fetch(`/api/logs/${log._id}`, { method: 'DELETE' });
                        loadMealLogs();
                    };

                    li.appendChild(textSpan);
                    li.appendChild(editBtn);
                    li.appendChild(deleteBtn);
                    ul.appendChild(li);
                });
            } catch (err) {
                console.error(err);
            }
        }

        loadBreakfastItems();
        loadMealLogs();
    </script>
</body>

</html>
