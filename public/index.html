<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Breakfast Buddy</title>

    <style>
        body {
            background-color: #e2c4f3;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #b45898;
            text-align: center;
            background-color: #ffffff;
        }

        h2,
        h3 {
            color: #b14490;
        }

        #inputSection,
        #selectSection,
        #logSection {
            margin: 20px;
            padding: 20px;
            background-color: #f9e1f7;
            border-radius: 10px;
        }

        #inputSection {
            width: 400px;
        }

        #foodInput {
            width: 75%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #createBtn,
        #logBtn {
            background-color: #b45898;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        #foodButtons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            cursor: pointer;
        }

        #foodButtons button:not(.deleteBtn, .selected) {
            background-color: #b993a9;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }

        .selected {
            background-color: rgb(155, 228, 155);
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }

        .deleteBtn,
        .deleteBtn2 {
            background-color: red;
            color: white;
            border: none;
            margin-left: 3px;
            cursor: pointer;
        }

        .editBtn {
            background-color: #b45898;
            color: white;
            border: none;
            margin-left: 3px;
            cursor: pointer;
        }

        #breakList li {
            color: #b14490;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Welcome to Breakfast Buddy where you can track your breakfast every morning!</h1>

    <div id="inputSection">
        <h2>Create A New Breakfast Item Here</h2>

        <input id="foodInput" type="text" placeholder="Add breakfast item">
        <button id="createBtn" onclick="createFoodButton()">Create Button</button>
    </div>

    <div id="selectSection">
        <h2>Select Today's Breakfast By Clicking On Your Existing Breakfast Items</h2>

        <div id="foodButtons"></div>

        <br>
        <button id="logBtn" onclick="submitBreakfast()">Log Breakfast</button>
    </div>

    <div id="logSection">
        <h2>Breakfast Log</h2>
        <h3>Sorted From Newest to Oldest</h3>
        <ul id="breakList"></ul>
    </div>

    <script>
        document.getElementById("foodInput").addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                createFoodButton();
            }
        });

        async function createFoodButton() {
            let food = document.getElementById("foodInput").value.trim();
            if (!food) return;

            food = food.charAt(0).toUpperCase() + food.slice(1).toLowerCase();
            document.getElementById("foodInput").value = "";

            await fetch('/api/breakfast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: food })
            });

            loadBreakfastItems(); // refresh buttons from server
        }

        async function loadBreakfastItems() {
            try {
                const res = await fetch('/api/breakfast');
                const items = await res.json();
                const container = document.getElementById('foodButtons');
                container.innerHTML = '';

                items.forEach(item => {
                    const div = document.createElement('div');
                    const btn = document.createElement('button');
                    btn.textContent = item.name;
                    btn.onclick = () => btn.classList.toggle('selected');

                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = '✕';
                    deleteBtn.classList.add('deleteBtn');
                    deleteBtn.onclick = async () => {
                        await fetch(`/api/breakfast/${item._id}`, { method: 'DELETE' });
                        loadBreakfastItems();
                    };

                    div.appendChild(btn);
                    div.appendChild(deleteBtn);
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function submitBreakfast() {
            const selectedBtns = document.querySelectorAll("#foodButtons button.selected");
            if (!selectedBtns.length) return;

            const foods = Array.from(selectedBtns).map(b => b.textContent);
            const date = new Date().toISOString();

            await fetch('/api/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ foods, date })
            });

            selectedBtns.forEach(btn => btn.classList.remove('selected'));
            loadMealLogs(); // only render from server
        }

        async function loadMealLogs() {
            try {
                const res = await fetch('/api/logs');
                const logs = await res.json();
                const ul = document.getElementById('breakList');
                ul.innerHTML = '';

                logs.sort((a, b) => new Date(b.date) - new Date(a.date)); // newest first

                logs.forEach(log => {
                    const li = document.createElement('li');

                    const textSpan = document.createElement('span');
                    textSpan.textContent = `(${new Date(log.date).toLocaleString()}) ${log.foods.join(', ')}`;

                    const editBtn = document.createElement('button');
                    editBtn.classList.add('editBtn');
                    editBtn.textContent = 'Edit';

                    editBtn.onclick = async () => {
                        // Prompt for foods
                        const newFoods = prompt('Edit this breakfast log (comma-separated):', log.foods.join(', '));
                        if (!newFoods) return;
                        const updatedFoods = newFoods.split(',').map(f => f.trim());

                        // Prompt for date
                        const newDate = prompt('Edit the date/time of this log:', log.date);
                        if (!newDate) return;

                        // Send PUT request to update both foods and date
                        await fetch(`/api/logs/${log._id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ foods: updatedFoods, date: newDate })
                        });

                        loadMealLogs(); // refresh logs from server
                    };


                const deleteBtn = document.createElement('button');
                deleteBtn.classList.add('deleteBtn2');
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = async () => {
                    await fetch(`/api/logs/${log._id}`, { method: 'DELETE' });
                    loadMealLogs();
                };

                li.appendChild(textSpan);
                li.appendChild(editBtn);
                li.appendChild(deleteBtn);
                ul.appendChild(li);
            });
        } catch (err) {
            console.error(err);
        }
        }

        loadBreakfastItems();
        loadMealLogs();
    </script>



</body>

</html>
